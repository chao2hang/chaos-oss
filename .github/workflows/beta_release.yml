name: Beta Release builds

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    name: Beta Release Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update beta ref
        run: |
          git tag -f beta
          git push origin beta -f || true

      - name: Write CHANGELOG
        run: |
          npx changelogithub --from 89077c35 --output CHANGELOG.md || true

      - name: Upload changelog to beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create beta --prerelease --notes-file CHANGELOG.md --title "Beta (latest)" --clobber 2>/dev/null || gh release edit beta --prerelease --notes-file CHANGELOG.md

  release:
    needs: changelog
    name: Linux amd64 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Build Linux amd64 static binary
        run: |
          mkdir -p build
          BUILD_AT="$(date +'%F %T %z')"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          go build \
            -tags=jsoniter \
            -ldflags="-w -s -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$BUILD_AT' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$GIT_COMMIT' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=beta' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'" \
            -o build/chaos-oss-linux-amd64 .

      - name: Compress binary
        run: |
          mkdir -p build/compress
          cd build
          zip -j compress/chaos-oss-linux-amd64.zip chaos-oss-linux-amd64

      - name: Upload to beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload beta build/compress/chaos-oss-linux-amd64.zip --clobber
