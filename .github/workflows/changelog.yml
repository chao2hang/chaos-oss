name: Release Automatic changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete beta tag
        run: git tag -d beta
        continue-on-error: true

      # constrain the changelog to the fork's own history: this repo
      # carries the whole upstream history and GitHub caps release notes
      # at 125k chars
      - run: npx changelogithub --from 89077c35
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
