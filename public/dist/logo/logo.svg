<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="chaos-oss">
  <title>chaos-oss</title>
  <!-- container: near-black, hairline ring -->
  <rect width="256" height="256" rx="48" fill="#0a0a0a" stroke="#23232a" stroke-width="2"/>
  <!-- tree: square-capped strokes, root left / branches right -->
  <g fill="none" stroke="#fafafa" stroke-width="18" stroke-linecap="square">
    <path d="M 84 62 V 194"/>
    <path d="M 84 122 H 172"/>
    <path d="M 84 194 H 172"/>
  </g>
  <!-- nodes: root + two children, middle one carries the accent -->
  <rect x="64" y="42" width="40" height="40" rx="10" fill="#fafafa"/>
  <rect x="152" y="102" width="40" height="40" rx="10" fill="#6b88ff"/>
  <rect x="152" y="174" width="40" height="40" rx="10" fill="#fafafa"/>
</svg>
